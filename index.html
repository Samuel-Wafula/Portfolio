<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Samuel Wafula - Cybersecurity and Digital Forensics professional portfolio, featuring IT support, cybersecurity projects, digital forensics, security labs and technical skills.">

  <meta name="keywords"
        content="Samuel Wafula, Cybersecurity, Digital Forensics, IT Support, Network Security, Security Analyst, Kenya">

  <meta name="author" content="Samuel Wafula">

  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <title>Samuel Wafula | Cybersecurity & Digital Forensics</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --bg: #07111f;
      --bg-light: #0b1728;
      --card: rgba(14, 30, 50, 0.75);
      --card-solid: #0e1e32;

      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --secondary: #22d3ee;

      --text: #f1f5f9;
      --text-light: #cbd5e1;
      --muted: #94a3b8;

      --border: rgba(148, 163, 184, 0.15);

      --success: #34d399;

      --radius: 18px;

      --transition: all 0.3s ease;
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(56,189,248,0.08), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(34,211,238,0.06), transparent 30%),
        var(--bg);

      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    img {
      max-width: 100%;
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      z-index: 1000;

      background: rgba(7,17,31,0.82);
      backdrop-filter: blur(15px);

      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;

      padding: 1rem 1.5rem;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: "Space Mono", monospace;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      font-size: 1.1rem;
    }

    .logo span {
      color: white;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--primary);
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100vh;

      max-width: 1200px;
      margin: auto;

      padding: 9rem 1.5rem 5rem;

      display: grid;
      grid-template-columns: 1.2fr 0.8fr;

      align-items: center;

      gap: 4rem;
    }

    .hero-content {
      animation: fadeUp 0.8s ease;
    }

    .terminal-label {
      font-family: "Space Mono", monospace;
      color: var(--success);

      font-size: 0.9rem;

      margin-bottom: 1.2rem;
    }

    .terminal-label::before {
      content: "> ";
      color: var(--primary);
    }

    .hero h1 {
      font-size: clamp(2.7rem, 6vw, 5rem);
      line-height: 1.05;

      margin-bottom: 1.5rem;

      letter-spacing: -2px;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero-description {
      max-width: 650px;

      font-size: 1.15rem;

      color: var(--text-light);

      margin-bottom: 2rem;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 0.85rem 1.4rem;

      border-radius: 10px;

      text-decoration: none;

      font-weight: 600;

      transition: var(--transition);
    }

    .btn-primary {
      background: var(--primary);
      color: #03101c;
    }

    .btn-primary:hover {
      background: var(--secondary);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(56,189,248,0.2);
    }

    .btn-outline {
      border: 1px solid var(--border);
      color: var(--text);
      background: rgba(255,255,255,0.03);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-3px);
    }


    /* =========================================================
       PROFILE IMAGE
    ========================================================= */

    .hero-image {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .profile-container {
      position: relative;
    }

    .profile-container::before {
      content: "";

      position: absolute;

      width: 320px;
      height: 320px;

      border-radius: 50%;

      border: 1px solid rgba(56,189,248,0.25);

      animation: pulse 4s infinite;
    }

    .profile-image {
      width: 280px;
      height: 280px;

      object-fit: cover;

      border-radius: 50%;

      border: 4px solid var(--primary);

      box-shadow:
        0 0 40px rgba(56,189,248,0.25),
        0 20px 60px rgba(0,0,0,0.4);

      position: relative;

      z-index: 2;
    }


    /* =========================================================
       SECTIONS
    ========================================================= */

    section {
      max-width: 1200px;

      margin: auto;

      padding: 6rem 1.5rem;
    }

    .section-heading {
      margin-bottom: 3rem;
    }

    .section-label {
      font-family: "Space Mono", monospace;

      color: var(--primary);

      font-size: 0.85rem;

      margin-bottom: 0.5rem;
    }

    .section-heading h2 {
      font-size: 2.5rem;

      line-height: 1.2;
    }

    .section-heading p {
      color: var(--muted);

      margin-top: 0.8rem;

      max-width: 700px;
    }


    /* =========================================================
       ABOUT
    ========================================================= */

    .about-grid {
      display: grid;

      grid-template-columns: 1.2fr 0.8fr;

      gap: 2rem;
    }

    .about-card {
      background: var(--card);

      border: 1px solid var(--border);

      padding: 2rem;

      border-radius: var(--radius);

      backdrop-filter: blur(10px);
    }

    .about-card p {
      color: var(--text-light);

      margin-bottom: 1rem;
    }

    .highlight {
      color: var(--primary);
      font-weight: 600;
    }


    /* =========================================================
       STATS
    ========================================================= */

    .stats {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 1rem;
    }

    .stat {
      background: var(--card-solid);

      border: 1px solid var(--border);

      border-radius: 14px;

      padding: 1.5rem;

      text-align: center;
    }

    .stat strong {
      display: block;

      font-size: 1.7rem;

      color: var(--primary);
    }

    .stat span {
      color: var(--muted);

      font-size: 0.85rem;
    }


    /* =========================================================
       EXPERIENCE
    ========================================================= */

    .timeline {
      border-left: 2px solid rgba(56,189,248,0.3);

      padding-left: 2rem;
    }

    .timeline-item {
      position: relative;

      margin-bottom: 2rem;

      background: var(--card);

      border: 1px solid var(--border);

      padding: 2rem;

      border-radius: var(--radius);
    }

    .timeline-item::before {
      content: "";

      position: absolute;

      left: -2.55rem;

      top: 2rem;

      width: 12px;
      height: 12px;

      background: var(--primary);

      border-radius: 50%;

      box-shadow: 0 0 15px rgba(56,189,248,0.7);
    }

    .timeline-date {
      font-family: "Space Mono", monospace;

      color: var(--primary);

      font-size: 0.8rem;
    }

    .timeline-item h3 {
      margin: 0.4rem 0;
    }

    .timeline-item h4 {
      color: var(--muted);

      font-weight: 500;

      margin-bottom: 1rem;
    }

    .timeline-item ul {
      padding-left: 1.2rem;

      color: var(--text-light);
    }


    /* =========================================================
       SKILLS
    ========================================================= */

    .skills-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 1.5rem;
    }

    .skill-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 1.8rem;

      transition: var(--transition);
    }

    .skill-card:hover {
      transform: translateY(-5px);

      border-color: rgba(56,189,248,0.4);
    }

    .skill-card h3 {
      margin-bottom: 1rem;

      color: var(--primary);
    }

    .skill-tags {
      display: flex;

      flex-wrap: wrap;

      gap: 0.6rem;
    }

    .tag {
      padding: 0.45rem 0.75rem;

      background: rgba(56,189,248,0.08);

      border: 1px solid rgba(56,189,248,0.15);

      border-radius: 6px;

      font-size: 0.8rem;

      color: var(--text-light);
    }


    /* =========================================================
       PROJECTS
    ========================================================= */

    .projects-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 1.5rem;
    }

    .project-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 2rem;

      transition: var(--transition);

      display: flex;

      flex-direction: column;
    }

    .project-card:hover {
      transform: translateY(-6px);

      border-color: rgba(56,189,248,0.4);

      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .project-number {
      font-family: "Space Mono", monospace;

      color: var(--primary);

      font-size: 0.8rem;

      margin-bottom: 1rem;
    }

    .project-card h3 {
      font-size: 1.4rem;

      margin-bottom: 0.8rem;
    }

    .project-card p {
      color: var(--text-light);

      margin-bottom: 1.5rem;
    }

    .project-tech {
      display: flex;

      flex-wrap: wrap;

      gap: 0.5rem;

      margin-top: auto;
    }

    .tech {
      color: var(--primary);

      font-family: "Space Mono", monospace;

      font-size: 0.7rem;
    }


    /* =========================================================
       LABS
    ========================================================= */

    .lab-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 1.5rem;
    }

    .lab-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      overflow: hidden;

      transition: var(--transition);
    }

    .lab-card:hover {
      transform: translateY(-5px);
    }

    .lab-card img {
      width: 100%;

      height: 220px;

      object-fit: cover;

      border-bottom: 1px solid var(--border);
    }

    .lab-content {
      padding: 1.7rem;
    }

    .lab-content h3 {
      margin-bottom: 1rem;
    }

    .lab-content p {
      color: var(--text-light);

      margin-bottom: 0.7rem;
    }


    /* =========================================================
       RESEARCH
    ========================================================= */

    .research-card {
      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,0.08),
          rgba(34,211,238,0.03)
        );

      border: 1px solid rgba(56,189,248,0.2);

      border-radius: var(--radius);

      padding: 3rem;
    }

    .research-card h3 {
      font-size: 1.7rem;

      margin-bottom: 1rem;

      color: var(--primary);
    }

    .research-card p {
      color: var(--text-light);

      max-width: 850px;
    }


    /* =========================================================
       CONTACT
    ========================================================= */

    .contact-grid {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 1rem;
    }

    .contact-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 14px;

      padding: 1.5rem;

      text-decoration: none;

      transition: var(--transition);
    }

    .contact-card:hover {
      border-color: var(--primary);

      transform: translateY(-4px);
    }

    .contact-card span {
      display: block;

      color: var(--muted);

      font-size: 0.8rem;

      margin-bottom: 0.3rem;
    }

    .contact-card strong {
      color: var(--text);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      border-top: 1px solid var(--border);

      padding: 2rem 1.5rem;

      text-align: center;

      color: var(--muted);

      font-size: 0.85rem;
    }


    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes fadeUp {

      from {
        opacity: 0;

        transform: translateY(20px);
      }

      to {
        opacity: 1;

        transform: translateY(0);
      }

    }

    @keyframes pulse {

      0%, 100% {
        transform: scale(1);

        opacity: 0.5;
      }

      50% {
        transform: scale(1.08);

        opacity: 1;
      }

    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 900px) {

      .hero {
        grid-template-columns: 1fr;

        text-align: center;

        padding-top: 8rem;
      }
